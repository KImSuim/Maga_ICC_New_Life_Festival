<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>그들은 모두, 주가 필요해 | 2026 새생명전도축제</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=IBM+Plex+Sans+KR:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef5fd;
        --paper: #ffffff;
        --ink: #14263f;
        --muted: #5f7390;
        --line: #d3e1f2;
        --sky: #2e7bd0;
        --deep: #1b4f8f;
        --soft: #e3eefb;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1524;
          --paper: #12233b;
          --ink: #eaf1fb;
          --muted: #93a8c6;
          --line: #24395a;
          --sky: #6fb0ff;
          --deep: #9cc8ff;
          --soft: #183052;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1524;
        --paper: #12233b;
        --ink: #eaf1fb;
        --muted: #93a8c6;
        --line: #24395a;
        --sky: #6fb0ff;
        --deep: #9cc8ff;
        --soft: #183052;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "IBM Plex Sans KR",
          system-ui,
          -apple-system,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
        font-size: clamp(16px, 1vw + 11px, 25px);
        line-height: 1.65;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: min(94vw, 1180px);
        margin: 0 auto;
        padding: 0 clamp(16px, 3vw, 40px) 64px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: clamp(14px, 2vw, 26px) 0;
        gap: 12px;
      }
      .logo {
        font-weight: 700;
        color: var(--deep);
        font-size: 0.95em;
      }
      nav {
        display: flex;
        gap: 4px;
        background: var(--soft);
        border-radius: 999px;
        padding: 4px;
      }
      nav button {
        border: 0;
        background: none;
        color: var(--muted);
        padding: 0.4em 1.1em;
        border-radius: 999px;
        font: inherit;
        font-size: 0.85em;
        font-weight: 600;
        cursor: pointer;
      }
      nav button[aria-current="true"] {
        background: var(--paper);
        color: var(--deep);
        box-shadow: 0 1px 3px rgba(20, 50, 90, 0.15);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--sky);
        outline-offset: 3px;
      }
      .brush {
        font-family: "East Sea Dokdo", "IBM Plex Sans KR", cursive;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      h1 {
        font-size: clamp(2rem, 5.2vw, 4.4rem);
        line-height: 1.15;
        margin: 0 0 0.4em;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      h2 {
        font-size: clamp(1.4rem, 3.2vw, 2.4rem);
        line-height: 1.35;
        margin: 0.4em 0 1em;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1em;
      }
      .lead {
        color: var(--muted);
        max-width: 30em;
      }
      .pill {
        display: inline-block;
        background: var(--sky);
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 0.8em 2em;
        font-weight: 600;
      }
      .pill:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .ghost {
        background: transparent;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 0.65em 1.4em;
        font-weight: 600;
      }
      .ghost:hover {
        border-color: var(--sky);
      }
      /* intro */
      .intro {
        display: grid;
        gap: clamp(20px, 4vw, 56px);
        align-items: center;
        padding-top: 8px;
      }
      @media (min-width: 820px) {
        .intro {
          grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.1fr);
        }
      }
      .poster {
        width: 100%;
        max-width: 440px;
        border-radius: 20px;
        display: block;
        margin: 0 auto;
        box-shadow: 0 18px 50px -18px rgba(30, 80, 150, 0.45);
      }
      .intro .small {
        color: var(--deep);
        font-weight: 600;
        font-size: 0.9em;
        margin-bottom: 0.8em;
      }
      .fine {
        color: var(--muted);
        font-size: 0.8em;
        margin-top: 1.2em;
      }
      /* quiz */
      .q {
        max-width: 820px;
        margin: 0 auto;
        padding-top: clamp(8px, 3vh, 40px);
      }
      .bar {
        height: 4px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--sky);
        transition: width 0.35s;
      }
      .count {
        color: var(--muted);
        font-size: 0.85em;
        margin: 0.6em 0 1.4em;
      }
      .opts {
        display: grid;
        gap: 0.7em;
      }
      @media (min-width: 900px) {
        .opts {
          grid-template-columns: 1fr 1fr;
        }
      }
      .opt {
        text-align: left;
        background: var(--paper);
        border: 1.5px solid var(--line);
        border-radius: 16px;
        padding: 1em 1.2em;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .opt:hover {
        border-color: var(--sky);
      }
      .opt.sel {
        border-color: var(--sky);
        background: var(--soft);
      }
      .back {
        background: none;
        border: 0;
        color: var(--muted);
        margin-top: 1.4em;
        padding: 0.3em 0;
        font-size: 0.9em;
      }
      textarea,
      input[type="text"] {
        width: 100%;
        font: inherit;
        background: var(--paper);
        color: var(--ink);
        border: 1.5px solid var(--line);
        border-radius: 16px;
        padding: 0.9em 1.1em;
        resize: vertical;
      }
      textarea {
        min-height: 9em;
      }
      .row {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.8em;
        margin: 0.4em 0 1em;
      }
      .chk {
        display: flex;
        gap: 0.6em;
        align-items: flex-start;
        margin: 1em 0 1.4em;
        color: var(--muted);
        font-size: 0.9em;
      }
      .chk input {
        margin-top: 0.45em;
        accent-color: var(--sky);
      }
      /* invitation */
      .inv {
        max-width: 860px;
        margin: 0 auto;
        background: var(--paper);
        border: 1.5px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
        animation: rise 0.6s ease both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .inv .banner {
        width: 100%;
        height: clamp(190px, 32vw, 360px);
        object-fit: cover;
        object-position: 50% 24%;
        display: block;
      }
      .inv .body {
        padding: clamp(22px, 5vw, 56px);
      }
      .inv .ev {
        color: var(--deep);
        font-weight: 700;
        margin: 0;
      }
      .inv .title {
        font-size: clamp(1.9rem, 5vw, 3.2rem);
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--sky);
        margin: 0.1em 0 0.8em;
      }
      .typebox {
        background: var(--soft);
        border-radius: 18px;
        padding: clamp(18px, 3.5vw, 32px);
        margin: 0 0 1.6em;
      }
      .typebox .kw {
        color: var(--deep);
        font-weight: 600;
        font-size: 0.9em;
      }
      .typebox h3 {
        margin: 0.1em 0 0.5em;
        font-size: 1.5em;
        letter-spacing: -0.02em;
      }
      .verse {
        margin: 1em 0 0;
        padding-top: 1em;
        border-top: 1px solid var(--line);
      }
      .verse q {
        display: block;
        quotes: none;
        font-weight: 300;
        font-size: 1.08em;
        color: var(--ink);
      }
      .verse span {
        display: block;
        color: var(--muted);
        font-size: 0.85em;
        margin-top: 0.3em;
      }
      .info {
        display: grid;
        gap: 1em;
        margin: 0 0 1.6em;
      }
      @media (min-width: 640px) {
        .info {
          grid-template-columns: 1fr 1fr;
        }
      }
      .info dt {
        font-weight: 700;
        color: var(--deep);
        font-size: 0.9em;
      }
      .info dd {
        margin: 0.15em 0 0;
      }
      .info a {
        color: var(--sky);
        font-size: 0.9em;
      }
      .close {
        color: var(--muted);
        margin: 0;
      }
      .close b {
        color: var(--ink);
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7em;
        justify-content: center;
        margin-top: 1.6em;
      }
      .mine {
        max-width: 860px;
        margin: 1.4em auto 0;
        color: var(--muted);
        font-size: 0.9em;
        text-align: center;
      }
      /* community */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        margin: 0 0 1.4em;
      }
      .chip {
        border: 1.5px solid var(--line);
        background: var(--paper);
        border-radius: 999px;
        padding: 0.3em 1em;
        font-size: 0.85em;
        font-weight: 600;
        color: var(--muted);
      }
      .chip[aria-pressed="true"] {
        background: var(--sky);
        border-color: var(--sky);
        color: #fff;
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      }
      .card {
        background: var(--paper);
        border: 1.5px solid var(--line);
        border-radius: 18px;
        padding: 1.1em 1.2em;
        display: flex;
        flex-direction: column;
        gap: 0.6em;
      }
      .card p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .card small {
        color: var(--muted);
        font-size: 0.8em;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .tag {
        color: var(--deep);
        font-weight: 700;
      }
      .note {
        background: var(--soft);
        border-radius: 14px;
        padding: 0.8em 1.1em;
        color: var(--muted);
        font-size: 0.85em;
        margin: 0 0 1.2em;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 20, 40, 0.55);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 20;
      }
      .dlg {
        background: var(--paper);
        color: var(--ink);
        border-radius: 20px;
        padding: 1.4em 1.5em;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .dlg h3 {
        margin: 0 0 0.4em;
        font-size: 1.2em;
      }
      .dlg p {
        color: var(--muted);
        margin: 0 0 0.6em;
      }
      .dlg ul {
        margin: 0 0 1.2em;
        padding-left: 1.2em;
      }
      .dlg li {
        font-weight: 600;
        color: var(--deep);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 0.6em 1.2em;
        border-radius: 999px;
        font-size: 0.85em;
        z-index: 9;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

    <div class="wrap">
      <header>
        <div class="logo">2026 새생명전도축제</div>
        <nav aria-label="메뉴">
          <button id="nTest" aria-current="true">마음 테스트</button
          ><button id="nComm" aria-current="false">마음 나눔</button>
        </nav>
      </header>
      <main id="view" aria-live="polite"></main>
    </div>

          kw: "평안",
          name: "마음이 바쁜 사람",
          desc: "생각이 많고 마음이 분주한 편이에요. 잠잠히 머무를 수 있는 평안이 필요해요.",
          verse:
            "모든 지각에 뛰어난 하나님의 평강이 너희 마음과 생각을 지키시리라",
          ref: "빌립보서 4:7",
        },
        hope: {
          kw: "소망",
          name: "내일을 기대하는 사람",
          desc: "지금도 괜찮지만 더 깊은 기쁨과 희망을 바라고 있어요. 내일을 기대할 이유를 찾는 마음이에요.",
          verse:
            "너희를 향한 나의 생각을 내가 아나니 평안이요 너희에게 미래와 희망을 주는 것이니라",
          ref: "예레미야 29:11",
        },
      };
      const QS = [
        {
          q: "주말에 가장 하고 싶은 것은?",
          o: [
            ["아무 일정 없이 푹 쉬기", "rest"],
            ["좋아하는 사람들과 시간 보내기", "with"],
            ["혼자 조용히 음악을 들으며 생각 정리하기", "comfort"],
            ["새로운 것을 배우거나 도전해 보기", "guide"],
            ["밀린 일을 정리하며 마음 가다듬기", "peace"],
          ],
        },
        {
          q: "최근 가장 자주 한 생각은?",
          o: [
            ["요즘 좀 바쁘고 피곤하다", "rest"],
            ["앞으로 뭘 하면 좋을지 생각이 많다", "guide"],
            ["나는 잘하고 있는 걸까", "love"],
            ["대체로 괜찮은데 뭔가 더 있으면 좋겠다", "hope"],
            ["말 못 한 감정이 마음에 조금 남아 있다", "comfort"],
          ],
        },
        {
          q: "친구가 힘들다고 하면 나는?",
          o: [
            ["곁에 있어 주려고 한다", "with"],
            ["따뜻한 말을 건넨다", "comfort"],
            ["일단 좀 쉬라고 권한다", "rest"],
            ["해결 방법을 같이 찾아본다", "guide"],
            ["잘될 거라고 힘을 준다", "hope"],
          ],
        },
        {
          q: "내가 에너지를 얻는 때는?",
          o: [
            ["충분히 쉬었을 때", "rest"],
            ["누군가 내 이야기를 들어줄 때", "with"],
            ["인정받고 칭찬받을 때", "love"],
            ["목표 하나를 이뤘을 때", "guide"],
            ["마음이 차분하고 평온할 때", "peace"],
          ],
        },
        {
          q: "처음 가는 모임에서 나는?",
          o: [
            ["어색해도 금방 적응한다", "with"],
            ["처음엔 조용히 지켜본다", "peace"],
            ["어떻게 보일지 신경이 쓰인다", "love"],
            ["새로운 사람을 만나는 게 설렌다", "hope"],
            ["사람이 많아도 가끔 쓸쓸할 때가 있다", "comfort"],
          ],
        },
        {
          q: "SNS를 보고 나면 드는 마음은?",
          o: [
            ["재밌지만 가끔 나와 비교하게 된다", "love"],
            ["시간이 훅 지나가서 피곤하다", "rest"],
            ["다들 바빠 보여 내 방향을 점검하게 된다", "guide"],
            ["누군가의 아픈 이야기에 마음이 쓰인다", "comfort"],
            ["별 감흥은 없고 가끔 허전하다", "hope"],
          ],
        },
        {
          q: "앞으로의 일(진로, 관계, 미래)을 생각하면?",
          o: [
            ["기대되는 마음이 크다", "hope"],
            ["막연해서 방향을 잡고 싶다", "guide"],
            ["걱정이 먼저 든다", "peace"],
            ["함께 걸어갈 사람이 있으면 든든하겠다", "with"],
            ["지금 이대로도 충분하다고 느낀다", "love"],
          ],
        },
        {
          q: "지칠 때 나는 주로?",
          o: [
            ["잠을 자거나 아무것도 안 한다", "rest"],
            ["누군가에게 털어놓는다", "with"],
            ["혼자 삭이며 버틴다", "comfort"],
            ["마음을 다잡으려고 기도하거나 명상한다", "peace"],
            ["더 열심히 하며 나를 증명하려 한다", "love"],
          ],
        },
        {
          q: "누군가에게 가장 듣고 싶은 말은?",
          o: [
            ['"고생 많았어, 좀 쉬어"', "rest"],
            ['"내가 곁에 있을게"', "with"],
            ['"많이 힘들었겠다"', "comfort"],
            ['"너는 있는 그대로 괜찮아"', "love"],
            ['"다 잘될 거야"', "hope"],
          ],
        },
        {
          q: "지금 나에게 가장 필요한 것을 고른다면?",
          o: [
            ["여유와 휴식", "rest"],
            ["믿고 기댈 수 있는 사람", "with"],
            ["마음의 평안", "peace"],
            ["분명한 방향과 확신", "guide"],
            ["변하지 않는 기쁨과 희망", "hope"],
          ],
        },
      ];
      const view = document.getElementById("view"),
        nT = document.getElementById("nTest"),
        nC = document.getElementById("nComm");
      const st = { i: 0, ans: [], type: null, tab: "test", filter: "all" };
      let DB = null,
        canWrite = false,
        posts = [],
        unsub = null;
      const $ = (s, r = view) => r.querySelector(s);
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      function toast(m) {
        const t = el("div", "toast", m);
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2600);
      }
      function tab(n) {
        st.tab = n;
        nT.setAttribute("aria-current", n === "test");
        nC.setAttribute("aria-current", n === "comm");
        if (n === "comm") comm();
        else if (st.type) invite();
        else intro();
        window.scrollTo({ top: 0 });
      }
      nT.onclick = () => tab("test");
      nC.onclick = () => tab("comm");

      function intro() {
        st.i = 0;
        st.ans = [];
        st.type = null;
        view.innerHTML = `<section class="intro">
    <img class="poster" alt="그들은 모두 주가 필요해 포스터" src="${POSTER}">
    <div>
      <div class="small">2026.10.25 SUN 2:30 · 마가의다락방교회 청년부</div>
      <h1>요즘 내 마음은<br>어떤 모습인가요?</h1>
      <p class="lead">열 가지 질문에 편하게 답하고, 마지막으로 요즘 마음에 남는 생각을 적어 주세요. 지금 내 마음에 가까운 유형을 알려드려요.</p>
      <button class="pill" id="go">테스트 시작하기</button>
      <p class="fine">약 3분 걸려요. 정답은 없고, 특별한 고민이 없어도 괜찮아요. 적은 내용은 내가 허락한 경우에만 익명으로 공유돼요.</p>
    </div></section>`;
        $("#go").onclick = ask;
      }
      function ask() {
        const it = QS[st.i];
        view.innerHTML = `<section class="q"><div class="bar"><i style="width:${(st.i / (QS.length + 1)) * 100}%"></i></div>
    <div class="count">${st.i + 1} / ${QS.length + 1}</div><h2>${it.q}</h2><div class="opts" id="opts"></div>
    <button class="back" id="bk" ${st.i ? "" : "hidden"}>이전 질문</button></section>`;
        const box = $("#opts");
        it.o.forEach((o, k) => {
          const b = el("button", "opt", o[0]);
          b.onclick = () => {
            if (st.lock) return;
            st.lock = 1;
            b.classList.add("sel");
            st.ans[st.i] = o[1];
            setTimeout(() => {
              st.lock = 0;
              st.i++;
              st.i < QS.length ? ask() : last();
            }, 260);
          };
          box.appendChild(b);
        });
        $("#bk").onclick = () => {
          st.i--;
          st.ans.pop();
          ask();
        };
      }
      function popup(title, msg, items) {
        const ov = el("div", "ov"),
          bx = el("div", "dlg");
        bx.setAttribute("role", "dialog");
        bx.setAttribute("aria-modal", "true");
        bx.appendChild(el("h3", "", title));
        bx.appendChild(el("p", "", msg));
        if (items && items.length) {
          const u = el("ul");
          items.forEach((i) => u.appendChild(el("li", "", i)));
          bx.appendChild(u);
        }
        const b = el("button", "pill", "확인");
        const close = () => {
          ov.remove();
          document.removeEventListener("keydown", k);
        };
        const k = (e) => {
          if (e.key === "Escape") close();
        };
        document.addEventListener("keydown", k);
        b.onclick = close;
        ov.onclick = (e) => {
          if (e.target === ov) close();
        };
        bx.appendChild(b);
        ov.appendChild(bx);
        document.body.appendChild(ov);
        b.focus();
      }
      function last() {
        view.innerHTML = `<section class="q"><div class="bar"><i style="width:${(QS.length / (QS.length + 1)) * 100}%"></i></div>
    <div class="count">${QS.length + 1} / ${QS.length + 1}</div>
    <h2>요즘 가장 마음에 남는 고민이나 생각을 적어 주세요</h2>
    <textarea id="tx" maxlength="300" placeholder="고민이 없다면 감사한 일을 적어도 좋고, 비워 두어도 괜찮아요."></textarea>
    <div class="row"><span>비워 두어도 결과를 볼 수 있어요</span><span id="ct">0 / 300</span></div>
    <label for="nk" style="display:block;font-weight:600;margin:.2em 0 .4em">별명 (이야기를 적으면 필수)</label>
    <input type="text" id="nk" maxlength="12" placeholder="실명이 아니어도 괜찮아요" style="margin-bottom:.4em">
    <label class="chk"><input type="checkbox" id="sh"><span>적은 이야기를 별명과 함께 '마음 나눔'에 공유할게요. (이야기를 적었다면 필수예요)</span></label>
    <button class="pill" id="sub">제출하고 결과 보기</button><br>
    <button class="back" id="bk">이전 질문</button></section>`;
        const tx = $("#tx"),
          sub = $("#sub");
        tx.oninput = () => {
          $("#ct").textContent = tx.value.length + " / 300";
        };
        $("#bk").onclick = () => {
          st.i = QS.length - 1;
          st.ans.pop();
          ask();
        };
        sub.onclick = async () => {
          const txt = tx.value.trim(),
            nk = $("#nk").value.trim();
          if (txt) {
            const miss = [];
            if (!nk) miss.push("별명을 적어 주세요.");
            if (!$("#sh").checked)
              miss.push("'마음 나눔'에 공유하는 것에 체크해 주세요.");
            if (miss.length) {
              popup(
                "아직 제출할 수 없어요",
                "이야기를 적은 경우에는 아래 항목이 필요해요.",
                miss,
              );
              return;
            }
          }
          sub.disabled = true;
          const tally = {};
          st.ans.forEach((a) => (tally[a] = (tally[a] || 0) + 1));
          st.type = Object.keys(tally).sort(
            (a, b) =>
              tally[b] - tally[a] || st.ans.indexOf(a) - st.ans.indexOf(b),
          )[0];
          st.text = tx.value.trim();
          st.nick = $("#nk").value.trim();
          if ($("#sh").checked && st.text)
            await share(st.text, st.type, st.nick);
          invite();
          window.scrollTo({ top: 0 });
        };
      }
      function invite() {
        const t = T[st.type];
        view.innerHTML = `<article class="inv"><div class="body">
    <p class="ev">나의 마음 유형 · ${t.kw}</p>
    <div class="title">${t.name}</div>
    <div class="typebox"><p>${t.desc}</p>
      <div class="verse"><q>${t.verse}</q><span>${t.ref}</span></div></div>
    <p class="close" id="mine"></p>
    <p class="close" style="margin-top:1.2em;font-size:.85em">2026 새생명전도축제 · 10월 25일(일) 오후 2시 30분 · 마가의다락방교회</p>
    </div></article>
    <div class="acts"><button class="pill" id="toC">다른 사람들의 마음 보기</button><button class="ghost" id="re">다시 해보기</button></div>`;
        $(".ev").textContent =
          (st.nick ? st.nick + "님의 " : "나의 ") + "마음 유형 · " + t.kw;
        $("#mine").textContent = st.text ? "내가 적은 이야기: " + st.text : "";
        $("#toC").onclick = () => tab("comm");
        $("#re").onclick = () => {
          st.type = null;
          intro();
        };
      }
      /* community */
      const SEED = [
        ["요즘 취업 준비가 길어져서 마음이 너무 조급해요.", "guide"],
        ["사람들 속에 있어도 혼자인 것 같아요.", "with"],
        ["아무것도 하기 싫고 그냥 푹 쉬고 싶어요.", "rest"],
        ["밤마다 걱정이 많아서 잠들기가 어려워요.", "peace"],
      ];
      async function initDb() {
        try {
          const u = await claude.use("user");
          const c = u ? await u.can("data.write") : null;
          DB = await claude.use("db");
          canWrite = !!DB && c !== false;
        } catch (e) {
          DB = null;
        }
      }
      async function share(text, type, nick) {
        const rec = {
          text: text.slice(0, 300),
          type,
          nick: (nick || "").slice(0, 12),
          at: Date.now(),
        };
        try {
          if (DB && canWrite) {
            await DB.collection("worries").add(rec);
            return;
          }
        } catch (e) {}
        posts.unshift(rec);
        toast("이 기기에만 저장됐어요");
      }
      function comm() {
        if (unsub) {
          unsub();
          unsub = null;
        }
        view.innerHTML = `<section><h1>마음 나눔</h1><p class="lead">같은 시대를 사는 사람들의 고민이에요. 이름 없이 공유되고, 서로를 위해 기도하는 자리예요.</p>
   <div class="note" id="nt"></div><div class="chips" id="chips"></div><div class="grid" id="gr"></div></section>`;
        const ch = $("#chips");
        [["all", "전체"], ...Object.keys(T).map((k) => [k, T[k].kw])].forEach(
          ([k, n]) => {
            const b = el("button", "chip", n);
            b.setAttribute("aria-pressed", st.filter === k);
            b.onclick = () => {
              st.filter = k;
              draw();
              ch.querySelectorAll(".chip").forEach((c, i) =>
                c.setAttribute(
                  "aria-pressed",
                  (i ? Object.keys(T)[i - 1] : "all") === k,
                ),
              );
            };
            ch.appendChild(b);
          },
        );
        $("#nt").textContent =
          DB && canWrite
            ? "공유된 고민이 실시간으로 올라와요."
            : "지금은 이 기기에서 적은 고민과 예시만 보여요. 모두가 함께 보는 공유 기능은 로그인 환경에서만 켜져요.";
        if (DB) {
          try {
            unsub = DB.collection("worries")
              .orderBy("at", "desc")
              .limit(60)
              .onSnapshot(
                (s) => {
                  posts = s.docs.map((d) => d.data());
                  draw();
                },
                () => {},
              );
          } catch (e) {}
        }
        draw();
      }
      function draw() {
        const g = $("#gr");
        if (!g) return;
        g.textContent = "";
        let list = posts.map((p) => ({ ...p }));
        if (!list.length)
          list = SEED.map((s) => ({ text: s[0], type: s[1], ex: 1 }));
        list = list.filter(
          (p) => T[p.type] && (st.filter === "all" || p.type === st.filter),
        );
        if (!list.length) {
          g.appendChild(el("p", "lead", "아직 이 주제의 고민이 없어요."));
          return;
        }
        list.forEach((p) => {
          const c = el("div", "card");
          c.appendChild(el("p", "", p.text));
          const s = el("small");
          s.appendChild(
            el("span", "tag", T[p.type].kw + " · " + (p.nick || "익명")),
          );
          s.appendChild(
            el(
              "span",
              "",
              p.ex
                ? "예시"
                : p.at
                  ? new Date(p.at).toLocaleDateString("ko-KR")
                  : "",
            ),
          );
          c.appendChild(s);
          g.appendChild(c);
        });
      }
      intro();
      initDb();
    </script>
  </body>
</html>
